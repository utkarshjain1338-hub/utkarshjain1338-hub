<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-label="Animated terminal showing whoami, stack and docker compose up" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f7d3"/><stop offset="0.5" stop-color="#2563eb"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="758" height="298" rx="12" fill="#0d1117" stroke="url(#glow)" stroke-width="1.5" stroke-opacity="0.55">
    <animate attributeName="stroke-opacity" values="0.35;0.8;0.35" dur="5s" repeatCount="indefinite"/>
  </rect>
  <path d="M1 13 a12 12 0 0 1 12 -12 h734 a12 12 0 0 1 12 12 v23 h-758 z" fill="#161b22"/>
  <line x1="1" y1="36" x2="759" y2="36" stroke="#21262d"/>
  <circle cx="24" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="19" r="6" fill="#27c93f"/>
  <text x="380.0" y="23" fill="#8b949e" font-size="12" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">utkarsh@linux: ~</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15">
  <clipPath id="c0"><rect x="28" y="64" height="26" width="0">
    <animate attributeName="width" dur="16.0s" repeatCount="indefinite" calcMode="discrete"
