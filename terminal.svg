      values="0;1;0;0" keyTimes="0;0.2500;0.9700;1"/></text>
  <clipPath id="c4"><rect x="28" y="172" height="26" width="0">
    <animate attributeName="width" dur="16.0s" repeatCount="indefinite" calcMode="discrete"
      values="0;18;27;36;45;54;63;72;81;90;99;108;117;126;135;144;153;162;171;180;189;198;0;0" keyTimes="0.0000;0.3125;0.3181;0.3237;0.3294;0.3350;0.3406;0.3463;0.3519;0.3575;0.3631;0.3688;0.3744;0.3800;0.3856;0.3912;0.3969;0.4025;0.4081;0.4138;0.4194;0.4250;0.9700;1"/></rect></clipPath>
  <g clip-path="url(#c4)">
