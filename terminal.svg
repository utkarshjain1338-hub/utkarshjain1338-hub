    <text x="46.0" y="136" fill="#e6edf3" textLength="117" lengthAdjust="spacing">cat stack.txt</text>
  </g>
  <text x="28" y="163" fill="#8b949e" opacity="0" textLength="360" lengthAdjust="spacing">go | docker | linux | postgresql | nginx
