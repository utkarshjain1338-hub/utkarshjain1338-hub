      values="0;1;0;0" keyTimes="0;0.1062;0.9700;1"/></text>
  <clipPath id="c2"><rect x="28" y="118" height="26" width="0">
    <animate attributeName="width" dur="16.0s" repeatCount="indefinite" calcMode="discrete"
      values="0;18;27;36;45;54;63;72;81;90;99;108;117;126;135;0;0" keyTimes="0.0000;0.1625;0.1678;0.1731;0.1784;0.1837;0.1889;0.1942;0.1995;0.2048;0.2101;0.2154;0.2207;0.2260;0.2313;0.9700;1"/></rect></clipPath>
  <g clip-path="url(#c2)">
