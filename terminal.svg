    <text x="46.0" y="190" fill="#e6edf3" textLength="180" lengthAdjust="spacing">docker compose up -d</text>
  </g>
  <text x="28" y="217" fill="#8b949e" opacity="0" textLength="135" lengthAdjust="spacing">[+] Running 3/3
    <animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" calcMode="discrete"
      values="0;1;0;0" keyTimes="0;0.4437;0.9700;1"/></text>
  <text x="28" y="244" fill="#3fb950" opacity="0" textLength="369" lengthAdjust="spacing">✔ postgres   ✔ app   ✔ nginx      Started
    <animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" calcMode="discrete"
      values="0;1;0;0" keyTimes="0;0.4750;0.9700;1"/></text>
  <clipPath id="c7"><rect x="28" y="253" height="26" width="0">
    <animate attributeName="width" dur="16.0s" repeatCount="indefinite" calcMode="discrete"
      values="0;18;27;36;45;54;63;72;81;90;99;108;117;126;135;0;0" keyTimes="0.0000;0.5625;0.5683;0.5740;0.5798;0.5856;0.5913;0.5971;0.6029;0.6087;0.6144;0.6202;0.6260;0.6317;0.6375;0.9700;1"/></rect></clipPath>
  <g clip-path="url(#c7)">
