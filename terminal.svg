  <g clip-path="url(#c0)">
    <text x="28" y="82" fill="#00f7d3" font-weight="700">$</text>
    <text x="46.0" y="82" fill="#e6edf3" textLength="54" lengthAdjust="spacing">whoami</text>
  </g>
  <text x="28" y="109" fill="#c9d1d9" opacity="0" textLength="396" lengthAdjust="spacing">utkarsh jain  //  backend &amp; systems tinkerer
